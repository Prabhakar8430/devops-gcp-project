name: Deploy to GKE

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }} # Ensure this secret is set in GitHub

    # 2. Set up Cloud SDK and force install the auth plugin
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    # 3. Fetch GKE credentials (this automatically configures kubectl to use the plugin)
    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: 'devops-cluster'            # Your GKE cluster name
        location: 'asia-south1-a'                # Your cluster zone or region
        project_id: 'devops-gke-project-496810'  # Your GCP project ID

    # 4. Apply your Kubernetes manifests
    - name: Deploy to GKE
      run: |
        kubectl apply -f kubernetes/namespace.yaml
